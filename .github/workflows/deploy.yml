name: deploy

# Push to main → image on GHCR. The box pulls it within two minutes.
#
# This workflow does **not** connect to the server, and must never be given a
# key that would let it. The Hetzner firewall allows TCP 22 from one address and
# Actions runners have ephemeral ones, so an SSH deploy could not work anyway —
# but the reason to keep it out is that a deploy key in GitHub would be a
# standing credential for an access path that is deliberately closed.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The build is the check. It fails when a published page links to one that
      # is not published, which is the only way the public/private split can go
      # wrong quietly — see the policy comment in site/nav.mjs.
      - name: Build
        run: npm run build

      # Belt and braces on the same split: the private documents must not appear
      # in the rendered output even if nav.mjs is edited carelessly. Greps for
      # the two facts that would matter most if they escaped.
      - name: No private content in the build
        run: |
          if grep -rlE '167\.233\.252\.136|root@167' dist/; then
            echo "::error::Production host details reached the built site"
            exit 1
          fi

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # This package is PUBLIC on GHCR, like ship's and peek's, so the box needs
      # no registry credentials. The consequence is that the password gates the
      # website and not the content — see the header comment in the Dockerfile
      # for why that is accepted, and what would invalidate it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
