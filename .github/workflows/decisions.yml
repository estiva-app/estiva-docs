name: decisions

# The rules of decisions/ (decisions/README.md), checked on every pull request.
# No dependencies, so no npm ci.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decision records follow their rules
        run: node --test scripts/decisions.test.mjs

      - name: The pointer check finds bad pointers
        run: node --test scripts/decision-pointers.test.mjs
