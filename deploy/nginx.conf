# Estiva docs, served at the root of docs.estiva.app.
#
# TLS, compression and edge caching are Cloudflare's job. This server sees plain
# HTTP from `cloudflared` on the loopback and does as little as possible.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Estiva documentation";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Real client addresses do not survive the tunnel, so what gets logged is the
    # Docker bridge gateway over and over. Keep the log for paths and status
    # codes; do not build rate limiting or blocklists on the address it reports.
    access_log /var/log/nginx/access.log;

    # Pre-release documentation behind a password has no business in a search
    # index. Belt and braces with the per-page meta tag — a crawler that somehow
    # gets past the gate should still be told not to keep this.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Every page is a real directory with an index.html, so a miss is a genuine
    # 404 rather than a client route to rewrite. No SPA fallback here.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The build emits fixed filenames, so caching these serves stale docs after
    # a deploy — the exact failure the two-minute pull loop exists to avoid.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
