<h1>Where a reply goes when its comment is deleted</h1>
<p class="sub">A decision brief for Miky · 17 October 2026 · Edit and delete your own comment in Leaf</p>

<div class="q"><strong>The question.</strong> When you delete your comment on a paragraph in Leaf and Katerina has already replied, does her reply stay beside that paragraph, or move to a pile at the end of the column with no place on the page?</div>

<h2>Today</h2>
<p>In Leaf a comment points at the words or blocks it is about, and those words are highlighted. A reply says only which comment it answers; it remembers no place of its own and takes its comment's. That rule was written into the spec on 14 October for Leaf 1, as an engineering choice; it was never asked as a question.</p>
<p>You decided on 16 October that replies to a deleted comment stay, under <em>"This comment was deleted."</em>, in every app, as Peek does. Peek shows a thread as a list, so place never comes up there. In Leaf it does: once the comment is gone, nothing left says which paragraph the thread was about. Today Leaf simply drops such replies.</p>

<h2>Why it reaches beyond this ticket</h2>
<ul>
<li>It decides <strong>what a reply on a page remembers</strong>: only whom it answers, or also what it is about. Every app that comments on parts of a file follows it, and so does an outside company's.</li>
<li>It also covers a reply whose comment a reader cannot see for another reason (it was filed in a Folder they cannot read).</li>
<li><strong>Two-way, with a tail.</strong> A is free to change later, but only replies written after the change gain a place. B, once replies carry a place on the relay, is undone by readers ignoring it; the extra words stay on those replies.</li>
</ul>

<h2>Options</h2>
<h3>A — The place goes with the comment</h3>
<p><strong>What you see:</strong> you delete your comment on paragraph 3. Katerina's reply leaves paragraph 3, the highlight goes, and the thread appears at the foot of the column in a collapsed group, "On a deleted comment", under "This comment was deleted." Reading it later, nobody can tell which paragraph she meant unless her words say so.</p>
<p><strong>Outside company:</strong> nothing new to write; one more state to draw (a thread with no place).</p>

<h3>B — Every reply remembers the thread's place</h3>
<p><strong>What you see:</strong> you delete your comment. Katerina's reply stays beside paragraph 3, highlighted, under "This comment was deleted." Replies already written before this change (Leaf comments exist only since 15 October) behave as in A.</p>
<p><strong>Outside company:</strong> every comment on a page says what it is about, so an app holding only a reply can still place it. That is the same idea as NIP-22, where each reply repeats which object the thread is on. The rule a reader follows: the comment's place while it exists, else the replies'.</p>
<p><strong>What it locks in:</strong> the spec's "a reply carries no place" is reversed. A reply now carries the quoted words of the page too, on a second person's event.</p>

<h3>Not an option: blank the comment instead of deleting it</h3>
<p>Editing the words away keeps the place, but the original words stay readable on the relay to anyone who reads the comment itself. That is not a delete, and it goes against "as Peek does".</p>

<h2>Trade-offs</h2>
<div class="tw"><table>
<tr><th></th><th>Protocol shape</th><th>What people see</th><th>Outside company</th><th>Undo cost</th><th>Build cost</th></tr>
<tr><td><strong>A</strong></td><td>A reply's meaning depends on one other person's event surviving.</td><td>A reply about paragraph 3 loses paragraph 3 the moment its comment is deleted.</td><td>No new rule; must draw a placeless thread.</td><td>None.</td><td>Small: Leaf only, plus the spec line.</td></tr>
<tr class="rec-row"><td><strong>B</strong></td><td>Every comment on a page names what it is about, replies included (as NIP-22 does for the object).</td><td>The thread stays beside its words after a delete.</td><td>One rule: copy the place into a reply; read the comment's place first.</td><td>Readers ignore the copied place; it stays on replies already written.</td><td>Moderate: the shared reply builder, Leaf, Peek (it replies to a page's comments with the same builder, and must pass the place), the spec.</td></tr>
</table></div>

<h2>How others do it</h2>
<ul>
<li><strong>Slack</strong>: a deleted parent leaves "This message was deleted." with its thread — what Peek copies. No page, so no place.</li>
<li><strong>Google Docs, Word</strong> (from memory, not re-checked): deleting the first comment deletes the whole discussion. They can, because one server owns every reply; on an open protocol we cannot delete someone else's reply.</li>
<li><strong>Nostr NIP-22</strong>: every reply repeats the thread's root object, so a reply alone knows what it is about. B extends that from "which file" to "which part of the file".</li>
</ul>

<h2>Recommendation</h2>
<div class="rec"><strong>B.</strong> On a page, a reply is about the words, not only about the comment above it, and a team document will have exactly this moment: someone tidies up their comment after a colleague answered. Keeping the place on every reply means the thread does not depend on one author's event surviving, and an outside app reading only a reply can still place it. Until B ships, older replies fall back to A's group, so A's drawing is built either way.</div>

<h2>Also settled at this kickoff (not asked, matching Peek)</h2>
<ul>
<li>A thread whose comment was deleted takes no new replies; each reply's author can still edit or delete their own (Peek: "The comment was deleted, so this thread takes no new replies.").</li>
<li>"This comment was deleted." is shown only when the relay holds the deletion, never just because a comment could not be read.</li>
<li>Delete asks to confirm first, as Peek does.</li>
</ul>

<h2>Checked</h2>
<ul>
<li>A reply carries no place: SPEC §13.6 ("MUST NOT carry a <code>block</code> tag of its own", added 2026-10-14), and Leaf's reply writer (<code>leaf src/comments/comments.ts</code>, <code>postReply</code>).</li>
<li>Leaf drops a reply whose comment is gone today: <code>readThreads</code>, same file.</li>
<li>The relay hides a deleted comment and keeps its replies: buzz <code>handle_standard_deletion_event</code> soft-deletes; reads filter deleted rows — <strong>read in code, not yet probed live</strong> (the ticket's production check covers it).</li>
<li>Peek's "no new replies" notice: <code>peek-app src/components/views/useFileConversationView.tsx</code>.</li>
<li>No Accepted record states that a reply has no place: the anchor record (<em>a-comment-points-at-blocks-and-the-words-quoted</em>) says a comment has one anchor; B keeps one anchor per thread, repeated on its replies.</li>
<li>Not measured: how many Leaf replies exist on production today (few; comments shipped 15 October).</li>
</ul>

<h2>For the record</h2>
<p>B: a reply <code>1111</code> copies its root's <code>block</code> and <code>quote</code> tags; reader rule "root's anchor if readable, else the earliest reply's". SPEC §13.6's "A reply carries no <code>block</code>" reversed; §6.5 gains the deleted-comment rules above; KINDS §1/§4 gain <code>40003</code>. Issue COMM-5 (30851:…:1500c6b4). Record: <code>decisions/a-reply-on-a-page-keeps-its-threads-place.md</code> (Proposed).</p>
